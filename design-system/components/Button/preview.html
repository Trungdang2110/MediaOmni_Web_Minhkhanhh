<!doctype html>
<html>
<head>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../bundle.css"><meta charset="utf-8"><title>Button — preview</title></head>
<body style="margin:0">
<div class="pr-root pr-col">
  <div class="pr-row">
    <button class="pr-btn pr-btn--primary">Xem kết quả</button>
    <button class="pr-btn pr-btn--ticket">Giải mã biểu đồ</button>
    <button class="pr-btn pr-btn--ghost">Xem công thức</button>
    <button class="pr-btn pr-btn--link">Bỏ qua</button>
  </div>
  <div class="pr-row">
    <button class="pr-btn pr-btn--primary" disabled><span class="pr-spin"></span>Đang tính…</button>
    <button class="pr-btn pr-btn--ghost" disabled>Lưu hồ sơ</button>
    <button class="pr-btn pr-btn--danger">Xóa toàn bộ lịch sử</button>
    <button class="pr-btn pr-btn--icon" aria-label="Lưu hồ sơ"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 3h12v18l-6-4-6 4z"/></svg></button>
    <button class="pr-btn pr-btn--icon" aria-label="Giao diện tối"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg></button>
  </div>
</div>
</body>
</html>
