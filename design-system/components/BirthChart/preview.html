<!doctype html>
<html>
<head>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../bundle.css"><meta charset="utf-8"><title>BirthChart — preview</title></head>
<body style="margin:0">
<div class="pr-root pr-row" style="align-items:flex-start;gap:28px">
  <div class="pr-chart" aria-label="Biểu đồ ngày sinh 21/10/2003">
    <div class="pr-cell pr-cell--on pr-cell--arrow">3</div><div class="pr-cell pr-cell--off">6</div><div class="pr-cell pr-cell--off">9</div>
    <div class="pr-cell pr-cell--on pr-cell--arrow">22</div><div class="pr-cell pr-cell--off">5</div><div class="pr-cell pr-cell--off">8</div>
    <div class="pr-cell pr-cell--on pr-cell--arrow">11</div><div class="pr-cell pr-cell--off">4</div><div class="pr-cell pr-cell--off">7</div>
  </div>
  <div class="pr-col" style="max-width:260px;gap:10px">
    <span class="pr-tag"><span class="pr-dot"></span>Mũi tên 1-2-3 · đủ số</span>
    <span class="pr-tag"><span class="pr-dot pr-dot--err"></span>Mũi tên 4-5-6 · trống</span>
    <p style="margin:0;font-size:15px;line-height:22px;color:var(--ink-muted)">Ô có số: nền giấy, chữ đỏ rượu. Ô vắng: nét đứt. Viền vàng: thuộc một mũi tên đủ số.</p>
    <button class="pr-btn pr-btn--ticket">Giải mã biểu đồ</button>
  </div>
</div>
</body>
</html>
